<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>间接蒸发冷 (IEC) 统一项目演示</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
        }
        .font-mono {
            font-family: 'JetBrains+Mono', monospace;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        /* Markdown styling overrides */
        .markdown-content h1 { @apply text-3xl font-bold mb-6 text-cyan-400 border-b border-slate-700 pb-2; }
        .markdown-content h2 { @apply text-2xl font-semibold mt-8 mb-4 text-cyan-300; }
        .markdown-content h3 { @apply text-xl font-medium mt-6 mb-3 text-cyan-200; }
        .markdown-content p { @apply mb-4 text-slate-300 leading-relaxed; }
        .markdown-content ul { @apply list-disc ml-6 mb-4 text-slate-300; }
        .markdown-content li { @apply mb-2; }
        .markdown-content strong { @apply text-cyan-400; }
        .markdown-content code { @apply bg-slate-800 px-1.5 py-0.5 rounded font-mono text-sm border border-slate-700; }
        .markdown-content hr { @apply border-slate-700 my-8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { motion, AnimatePresence } = FramerMotion;

        // --- Helper: Tailwind Merge Lite ---
        function cn(...inputs) {
            return inputs.filter(Boolean).join(' ');
        }

        // --- Configuration ---
        const MODES = [
            { id: 'dry', label: 'DRY MODE', desc: '新风自然冷却 (显热交换)', longDesc: '仅利用室外低温空气进行热交换，不消耗水分，节能性最高。' },
            { id: 'wet', label: 'WET MODE', desc: '喷淋蒸发冷却 (绝热过程)', longDesc: '开启喷淋系统，利用水分蒸发吸热显著降低空气温度。' },
            { id: 'hybrid', label: 'HYBRID', desc: '混合制冷模式 (全效率)', longDesc: '喷淋蒸发与机械制冷协同工作，应对极端高温高湿天气。' },
            { id: 'dx', label: 'DX MODE', desc: '纯压缩机制冷 (机械补位)', longDesc: '当室外湿度过高或需要深度除湿时，完全由冷媒循环提供冷量。' },
        ];

        const TEMP_CONFIG = {
            dry: { inlet: 35, outlet: 30, color: '#f97316' }, 
            wet: { inlet: 35, outlet: 24, color: '#3b82f6' }, 
            hybrid: { inlet: 35, outlet: 18, color: '#a855f7' }, 
            dx: { inlet: 35, outlet: 20, color: '#06b6d4' }, 
        };

        // --- Components ---

        const SprayParticles = () => {
            const drops = Array.from({ length: 25 });
            return (
                <g className="pointer-events-none">
                    {drops.map((_, i) => (
                        <motion.line
                            key={i}
                            x1={350 + (i * 4) + Math.random() * 5}
                            y1={130}
                            x2={350 + (i * 4) + Math.random() * 5}
                            y2={145}
                            stroke="#60a5fa"
                            strokeWidth="1.5"
                            strokeLinecap="round"
                            initial={{ y: -20, opacity: 0 }}
                            animate={{
                                y: [0, 180],
                                opacity: [0, 1, 0],
                            }}
                            transition={{
                                duration: 1.2 + Math.random() * 0.8,
                                repeat: Infinity,
                                ease: "linear",
                                delay: Math.random() * 2,
                            }}
                        />
                    ))}
                </g>
            );
        };

        const CondensationDrops = () => {
            return (
                <g>
                    {[1, 2, 3, 4, 5, 6].map((i) => (
                        <motion.circle
                            key={i}
                            cx={620 + (i % 3) * 8}
                            cy={210 + i * 15}
                            r="2.5"
                            fill="#bae6fd"
                            initial={{ opacity: 0, scale: 0 }}
                            animate={{ opacity: [0, 0.8, 0], y: [0, 15] }}
                            transition={{ duration: 2.5, repeat: Infinity, delay: i * 0.4 }}
                        />
                    ))}
                </g>
            );
        };

        const IECUnitDisplay = ({ mode, setMode }) => {
            const [displayTemp, setDisplayTemp] = useState(TEMP_CONFIG[mode]);

            useEffect(() => {
                const target = TEMP_CONFIG[mode];
                const interval = setInterval(() => {
                    setDisplayTemp((prev) => {
                        if (Math.abs(prev.outlet - target.outlet) < 0.1) return target;
                        const step = prev.outlet > target.outlet ? -0.2 : 0.2;
                        return { ...prev, outlet: Number((prev.outlet + step).toFixed(1)), color: target.color };
                    });
                }, 40);
                return () => clearInterval(interval);
            }, [mode]);

            const isWet = mode === 'wet' || mode === 'hybrid';
            const isDX = mode === 'dx' || mode === 'hybrid';

            return (
                <div className="w-full flex flex-col items-center">
                    {/* SVG Visualization */}
                    <div className="relative w-full max-w-4xl aspect-[16/9] bg-slate-900/80 rounded-2xl border border-slate-700 shadow-3xl overflow-hidden backdrop-blur-xl mb-8">
                        <div className="absolute inset-0 opacity-[0.05]"
                             style={{ backgroundImage: 'radial-gradient(#4fd1c5 1px, transparent 1px)', backgroundSize: '24px 24px' }}></div>

                        {/* Temp Overlays */}
                        <div className="absolute top-6 left-6 flex flex-col gap-1 z-10">
                            <span className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Inlet Air (OA)</span>
                            <div className="text-3xl font-mono font-bold text-orange-500 drop-shadow-[0_0_8px_rgba(249,115,22,0.3)]">
                                {TEMP_CONFIG[mode].inlet.toFixed(1)}°C
                            </div>
                        </div>

                        <motion.div 
                            className="absolute top-6 right-6 flex flex-col items-end gap-1 z-10"
                            animate={{ color: displayTemp.color }}
                        >
                            <span className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Supply Air (SA)</span>
                            <div className="text-3xl font-mono font-bold drop-shadow-md transition-colors duration-500">
                                {displayTemp.outlet.toFixed(1)}°C
                            </div>
                        </motion.div>

                        <svg viewBox="0 0 800 450" className="w-full h-full p-4">
                            <defs>
                                <linearGradient id="grad-core" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stopColor="#1e293b" />
                                    <stop offset="50%" stopColor="#334155" />
                                    <stop offset="100%" stopColor="#1e293b" />
                                </linearGradient>
                                <pattern id="pattern-core" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
                                    <path d="M0 12L12 0" stroke="#475569" strokeWidth="1" opacity="0.4"/>
                                </pattern>
                            </defs>

                            {/* Main Casing */}
                            <motion.rect 
                                x="50" y="60" width="700" height="330" rx="16" 
                                fill="none" stroke="#334155" strokeWidth="2"
                                initial={{ opacity: 0 }} animate={{ opacity: 1 }}
                            />

                            {/* Heat Recovery Core */}
                            <motion.path
                                d="M 400 100 L 520 225 L 400 350 L 280 225 Z"
                                fill="url(#grad-core)"
                                stroke="#475569"
                                strokeWidth="2"
                                whileHover={{ scale: 1.02 }}
                            />
                            <path d="M 400 100 L 520 225 L 400 350 L 280 225 Z" fill="url(#pattern-core)" />

                            {/* Flows */}
                            {/* Scavenger Air (Vertical) */}
                            <motion.path
                                d="M 400 420 L 400 350 L 400 100 L 400 30"
                                fill="none"
                                stroke="#f97316"
                                strokeWidth="4"
                                strokeDasharray="12 8"
                                strokeOpacity="0.4"
                                animate={{ strokeDashoffset: [0, -40] }}
                                transition={{ duration: 1.5, repeat: Infinity, ease: "linear" }}
                            />

                            {/* Process Air (Horizontal) */}
                            {/* Inlet to Core */}
                            <motion.path
                                d="M 0 225 L 280 225"
                                fill="none"
                                stroke="#ef4444"
                                strokeWidth="8"
                                strokeDasharray="24 12"
                                animate={{ strokeDashoffset: [36, 0] }}
                                transition={{ duration: 1.2, repeat: Infinity, ease: "linear" }}
                            />

                            {/* Core to Outlet */}
                            <motion.path
                                d="M 520 225 L 800 225"
                                fill="none"
                                strokeWidth="8"
                                strokeDasharray="24 12"
                                animate={{
                                    stroke: displayTemp.color,
                                    strokeDashoffset: [36, 0]
                                }}
                                transition={{
                                    stroke: { duration: 0.8 },
                                    strokeDashoffset: { duration: 1.2, repeat: Infinity, ease: "linear" }
                                }}
                            />

                            {/* Spray System */}
                            <AnimatePresence>
                                {isWet && (
                                    <motion.g initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}>
                                        <rect x="340" y="110" width="120" height="4" fill="#3b82f6" rx="2" />
                                        <SprayParticles />
                                    </motion.g>
                                )}
                            </AnimatePresence>

                            {/* DX Coil */}
                            <g transform="translate(600, 150)">
                                <rect x="0" y="0" width="40" height="150" rx="4" fill="#1e293b" stroke="#475569" strokeWidth="2" />
                                <motion.path
                                    d="M 10 20 H 30 M 10 45 H 30 M 10 70 H 30 M 10 95 H 30 M 10 120 H 30"
                                    stroke={isDX ? "#06b6d4" : "#475569"}
                                    strokeWidth="5"
                                    strokeLinecap="round"
                                    animate={{
                                        stroke: isDX ? "#06b6d4" : "#475569",
                                        opacity: isDX ? [0.6, 1, 0.6] : 1
                                    }}
                                    transition={{ duration: 2, repeat: Infinity }}
                                />
                                {isDX && <CondensationDrops />}
                            </g>
                        </svg>
                    </div>

                    {/* Mode Selection Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 w-full">
                        {MODES.map((m) => (
                            <button
                                key={m.id}
                                onClick={() => setMode(m.id)}
                                className={cn(
                                    "relative p-5 rounded-xl border text-left transition-all duration-300 group overflow-hidden",
                                    mode === m.id 
                                    ? "bg-slate-800 border-cyan-500 shadow-lg shadow-cyan-500/10" 
                                    : "bg-slate-800/30 border-slate-700 hover:border-slate-500 hover:bg-slate-800/50"
                                )}
                            >
                                {mode === m.id && (
                                    <motion.div 
                                        layoutId="glow"
                                        className="absolute inset-0 bg-gradient-to-r from-cyan-500/5 to-transparent pointer-events-none"
                                    />
                                )}
                                <div className={cn(
                                    "font-bold text-sm mb-1 tracking-wider uppercase",
                                    mode === m.id ? "text-cyan-400" : "text-slate-400"
                                )}>
                                    {m.label}
                                </div>
                                <div className="text-xs text-slate-500 group-hover:text-slate-300 transition-colors">
                                    {m.desc}
                                </div>
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const Documentation = () => (
            <div className="markdown-content max-w-4xl mx-auto py-12 px-6 bg-slate-800/20 rounded-2xl border border-slate-700/50 backdrop-blur-sm">
                <h1>间接蒸发冷架构的相关思考</h1>
                <p>系统核心设计思想：遵循自然冷却优先原则，最大限度利用室外低温新风（干模式）和蒸发冷却（湿模式）的免费冷源，仅在极端天气下启动机械制冷（混合模式），从而实现全年高效节能。</p>
                
                <h2>一、系统总体结构</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                        <h3>1. 空气侧组层</h3>
                        <ul>
                            <li><strong>新风进风段</strong>：设有高性能过滤网，保护后端芯体；</li>
                            <li><strong>换热段</strong>：专用交叉流/逆流热交换芯体，内外风道完全隔离，实现无污染换热；</li>
                            <li><strong>喷淋段</strong>：精密喷淋矩阵，通过精细雾化提高蒸发效率；</li>
                            <li><strong>风机段</strong>：配置大风量EC变频风机，根据压力需求实时调节转速；</li>
                        </ul>
                    </div>
                    <div>
                        <h3>2. 水系统与控制</h3>
                        <ul>
                            <li><strong>循环水路</strong>：包含全自动软化水箱、一用一备加压泵及防爆过滤系统；</li>
                            <li><strong>控制核心</strong>：工业级PLC运行逻辑，集成数百项实时监测指标；</li>
                            <li><strong>能源优化</strong>：动态PID调节，寻优计算最佳运行频率。</li>
                        </ul>
                    </div>
                </div>

                <hr />

                <h2>二、运行模式自动切换逻辑</h2>
                <p>系统根据室外湿球温度及回风温度，计算 <strong>制冷需求系数 (CFC)</strong>。模式切换旨在保证输出温度的同时最低化 PUE。</p>

                <div className="space-y-6">
                    <div className="p-4 bg-orange-500/10 border border-orange-500/20 rounded-lg">
                        <h3 className="!mt-0 font-bold text-orange-400">🌤 干模式 (CFC ≤ 80%)</h3>
                        <p className="text-sm">环境优越，仅通过显热交换即可带走热量。此时喷淋系统和DX压缩机保持关闭状态，风机极低功耗运行。</p>
                    </div>
                    <div className="p-4 bg-blue-500/10 border border-blue-500/20 rounded-lg">
                        <h3 className="!mt-0 font-bold text-blue-400">💧 湿模式 (80% < CFC ≤ 115%)</h3>
                        <p className="text-sm">开启喷淋系统。利用水蒸发吸热将新风侧降温至湿球温度附近，极大增强换热温差。此阶段完全替代机械制冷。</p>
                    </div>
                    <div className="p-4 bg-purple-500/10 border border-purple-500/20 rounded-lg">
                        <h3 className="!mt-0 font-bold text-purple-400">❄️ 混合模式 (CFC > 115%)</h3>
                        <p className="text-sm">极端天气模式。间接蒸发冷却负责预冷，DX 系统负责深度降温和除湿。两套制冷系统协同工作，确保极端情况下的环温安全。</p>
                    </div>
                </div>
            </div>
        );

        const App = () => {
            const [mode, setMode] = useState('dry');
            const [activeTab, setActiveTab] = useState('monitor');

            return (
                <div className="min-h-screen pb-24">
                    {/* Header */}
                    <header className="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
                        <div className="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 bg-cyan-500 rounded-lg flex items-center justify-center shadow-lg shadow-cyan-500/20">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5">
                                        <path d="M12 2v10" /><path d="M16 8l-4 4-4-4" /><path d="M12 22v-10" /><path d="M8 16l4-4 4 4" />
                                    </svg>
                                </div>
                                <div>
                                    <h1 className="text-lg font-bold tracking-tight">IEC <span className="text-cyan-400">UNIFIED</span> SYSTEM</h1>
                                    <p className="text-[10px] text-slate-500 uppercase tracking-tighter">Indirect Evaporative Cooling Monitor & Analysis</p>
                                </div>
                            </div>
                            <nav className="flex gap-1 bg-slate-800 p-1 rounded-lg border border-slate-700">
                                <button 
                                    onClick={() => setActiveTab('monitor')}
                                    className={cn(
                                        "px-4 py-1.5 rounded-md text-xs font-semibold transition-all",
                                        activeTab === 'monitor' ? "bg-slate-700 text-white shadow-sm" : "text-slate-400 hover:text-slate-200"
                                    )}
                                >
                                    系统监控
                                </button>
                                <button 
                                    onClick={() => setActiveTab('docs')}
                                    className={cn(
                                        "px-4 py-1.5 rounded-md text-xs font-semibold transition-all",
                                        activeTab === 'docs' ? "bg-slate-700 text-white shadow-sm" : "text-slate-400 hover:text-slate-200"
                                    )}
                                >
                                    技术文档
                                </button>
                            </nav>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="max-w-6xl mx-auto px-6 mt-12">
                        <AnimatePresence mode="wait">
                            {activeTab === 'monitor' ? (
                                <motion.div
                                    key="monitor"
                                    initial={{ opacity: 0, y: 20 }}
                                    animate={{ opacity: 1, y: 0 }}
                                    exit={{ opacity: 0, scale: 0.98 }}
                                    transition={{ duration: 0.4 }}
                                >
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-4">
                                        <div>
                                            <h2 className="text-3xl font-bold text-white mb-2">实时运行模拟</h2>
                                            <p className="text-slate-400 max-w-xl">切换不同环境模式，观察系统内部气流、水循环及机械制冷的变化。数据实时计算并模拟实际反馈效果。</p>
                                        </div>
                                        <div className="px-4 py-2 bg-slate-800 rounded-lg border border-slate-700 flex items-center gap-2">
                                            <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse" />
                                            <span className="text-xs font-mono text-slate-300">SYSTEM: ONLINE</span>
                                        </div>
                                    </div>
                                    
                                    <IECUnitDisplay mode={mode} setMode={setMode} />

                                    {/* Sidebar-style Info Panel */}
                                    <div className="mt-12 grid grid-cols-1 md:grid-cols-3 gap-6">
                                        <div className="p-6 bg-slate-800/40 rounded-xl border border-slate-700">
                                            <h4 className="text-sm font-bold text-cyan-400 mb-3 uppercase tracking-wider">当前模式逻辑</h4>
                                            <p className="text-sm text-slate-400 leading-relaxed">
                                                {MODES.find(m => m.id === mode)?.longDesc}
                                            </p>
                                        </div>
                                        <div className="p-6 bg-slate-800/40 rounded-xl border border-slate-700">
                                            <h4 className="text-sm font-bold text-cyan-400 mb-3 uppercase tracking-wider">系统健康度</h4>
                                            <div className="space-y-3">
                                                <div className="flex justify-between text-xs font-mono">
                                                    <span className="text-slate-500">机组负载:</span>
                                                    <span className="text-white">64%</span>
                                                </div>
                                                <div className="w-full bg-slate-700 h-1 rounded-full overflow-hidden">
                                                    <div className="bg-cyan-500 h-full w-[64%]" />
                                                </div>
                                                <div className="flex justify-between text-xs font-mono">
                                                    <span className="text-slate-500">PUE 预测:</span>
                                                    <span className="text-white">1.14</span>
                                                </div>
                                                <div className="w-full bg-slate-700 h-1 rounded-full overflow-hidden">
                                                    <div className="bg-emerald-500 h-full w-[20%]" />
                                                </div>
                                            </div>
                                        </div>
                                        <div className="p-6 bg-slate-800/40 rounded-xl border border-slate-700 flex flex-col justify-center items-center text-center">
                                            <div className="text-4xl font-bold text-white mb-1">0.14</div>
                                            <div className="text-[10px] text-slate-500 uppercase tracking-widest font-bold">WUE [L/kWh]</div>
                                            <div className="mt-4 text-xs text-slate-400">实时水利用效率最优</div>
                                        </div>
                                    </div>
                                </motion.div>
                            ) : (
                                <motion.div
                                    key="docs"
                                    initial={{ opacity: 0, y: 20 }}
                                    animate={{ opacity: 1, y: 0 }}
                                    exit={{ opacity: 0, y: -20 }}
                                >
                                    <Documentation />
                                </motion.div>
                            )}
                        </AnimatePresence>
                    </main>

                    {/* Footer */}
                    <footer className="mt-24 border-t border-slate-800 pt-8 opacity-50">
                        <div className="max-w-6xl mx-auto px-6 text-center text-xs text-slate-500">
                            <p>© 2026 IEC 间接蒸发冷项目 - 统一文件发布版本</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
